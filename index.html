<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  :root{
    color-scheme:light only;
    --paper:#FFFFFF; --ink:#2B2B2B; --pencil:#8C8C8C; --teal:#5E8F4E; --cyan:#4CC64A;
    --hand:"Bradley Hand","Snell Roundhand","Marker Felt","Segoe Script",cursive;
    --sans:-apple-system,ui-sans-serif,"Helvetica Neue",Helvetica,sans-serif;
  }
  html{background:#FFFFFF}
  html,body{background:#FFFFFF !important}
  body::before{content:'cb-backplate';position:fixed;inset:-10vh -10vw;background:#FFFFFF;
               z-index:-1;color:transparent;font-size:0;pointer-events:none}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  *:focus,*:focus-visible{outline:none !important}
  textarea,input{-webkit-appearance:none;appearance:none;border:0}
  body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--sans);font-weight:400;
       font-size:16px;line-height:1.6;background:#FFFFFF;background-color:#FFFFFF;
       padding:calc(26px + env(safe-area-inset-top)) 24px calc(30px + env(safe-area-inset-bottom))}
  button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;font-weight:400}

  /* ---------- intro ---------- */
  .intro{position:relative;min-height:100vh;display:flex;flex-direction:column;
         align-items:center;justify-content:center;gap:30px;
         margin:calc(-26px - env(safe-area-inset-top)) -24px calc(-30px - env(safe-area-inset-bottom));
         padding:60px 24px 70px;background:#F4F2EC}
  .poster{display:flex;flex-direction:column;align-items:center;gap:0;width:100%;max-width:330px}
  .intro{gap:40px}
  .wordmark{position:absolute;left:0;right:0;bottom:26px;text-align:center;
            font-size:11px;font-weight:700;letter-spacing:.4em;color:var(--pencil);
            padding-left:.4em}
  .aperture{position:relative;width:100%;background:none;display:flex;flex-direction:column;
            align-items:center;gap:0;padding:0;animation:breathe 8s ease-in-out infinite}
  .bowl{width:min(52vw,196px);height:auto;display:block;color:var(--cyan)}
  .plate{display:block;background:var(--cyan);color:#F4F2EC;font-size:13px;font-weight:700;
         letter-spacing:.24em;padding:8px 20px}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @media (prefers-reduced-motion:reduce){.aperture{animation:none}}
  .intro p{margin:22px 0 0;color:var(--cyan);font-family:var(--hand);font-size:18px;
           font-weight:400;letter-spacing:.01em}
  .recent{width:100%;max-width:380px;display:flex;flex-direction:column;gap:2px}
  .recent h3{font-family:var(--hand);font-size:16px;color:var(--pencil);margin:8px 0 2px;font-weight:400}
  .recent button{display:flex;justify-content:space-between;align-items:baseline;gap:14px;width:100%;
    padding:11px 0;font-family:var(--hand);font-size:19px;color:var(--ink);text-align:left}
  .recent{max-width:330px}
  .recent button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .recent button em{font-style:normal;font-size:14px;color:var(--pencil);flex:none;font-family:var(--sans)}
  .themes{display:none}

  /* ---------- head ---------- */
  .head{display:flex;align-items:baseline;gap:14px;margin:0 0 2px}
  .title{flex:1 1 auto;min-width:0;font-family:var(--hand);font-size:26px;font-weight:400;
         color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .swap{font-size:14px;color:var(--pencil);flex:none;padding:10px 0}
  .status{font-size:14px;color:var(--pencil);margin:0 0 26px}
  .status.bad{color:#D2492F}
  .bpm{font:inherit;font-size:14px;color:var(--teal);padding:4px 0}

  /* ---------- waveform ---------- */
  canvas{display:block;width:100%;touch-action:none}
  .wavewrap{position:relative}
  #wave{height:110px;background:none}
  #strip{height:10px;margin-bottom:12px;background:none}
  #bigBtn{position:absolute;right:-4px;bottom:-4px;width:30px;height:30px;display:flex;
          align-items:center;justify-content:center;color:var(--pencil);opacity:.7;background:none}
  #bigBtn svg{width:13px;height:13px}
  #zoomBtn{position:absolute;left:-4px;bottom:-2px;display:none;font-family:var(--hand);
           font-size:16px;color:var(--pencil);padding:6px 4px}
  body.big #zoomBtn{display:block}
  body.big .status,body.big #strip,body.big .metarow,body.big .fader,
  body.big .details,body.big .list,body.big .hint,body.big #lib,body.big #swap{display:none}
  body.big #wave{height:calc(100vh - 280px);min-height:300px}
  .times{display:flex;justify-content:space-between;align-items:center;font-size:14px;
         color:var(--pencil);margin-top:14px}

  /* ---------- meta ---------- */
  .metarow{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:26px 0 0;
           font-size:14px;color:var(--pencil)}
  .metarow .meta{padding:8px 0;font:inherit;color:var(--pencil)}
  .metarow b{font-size:18px;font-weight:400;color:var(--ink)}
  .metarow b.hot{color:#D2492F}
  .gainlabel{display:flex;align-items:baseline;gap:7px}
  .gainlabel em{font-style:normal;font:inherit;color:#B3B0A8}
  #gainval{font-size:15px;color:var(--pencil)}
  .modewrap{display:flex;align-items:center;gap:9px}
  .modewrap button{font-family:var(--hand);font-size:18px;color:var(--cyan);padding:6px 2px}
  .modewrap button.off{color:var(--pencil)}
  .led{width:6px;height:6px;border-radius:50%;background:rgba(140,140,140,.3);flex:none}
  .led.on{background:#D2492F}
  .details{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin:14px 0 0;
           font-size:14px;color:var(--pencil)}
  .details b{font-size:16px;font-weight:400;color:var(--ink)}
  .details b.hot{color:#D2492F}

  /* ---------- gain ---------- */
  .fader,.fader *{touch-action:none}
  .fader{position:relative;height:40px;margin:6px 0 0}
  .fader .track{position:absolute;top:19px;left:0;right:0;height:1px;background:rgba(140,140,140,.28)}
  .fader .fill{position:absolute;top:19px;height:1px;background:var(--cyan)}
  .fader .unity{position:absolute;top:14px;width:1px;height:11px;background:rgba(140,140,140,.5)}
  .fader .thumb{position:absolute;top:13px;width:13px;height:13px;border-radius:50%;
                background:var(--cyan);margin-left:-6.5px}
  .scale{display:flex;justify-content:space-between;font-size:13px;color:var(--pencil)}

  /* ---------- eq ---------- */
  .eq{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin:18px 0 2px}
  .eqcol{display:flex;flex-direction:column;align-items:center;gap:8px}
  .eqbar,.eqbar *{touch-action:none}
  .eqbar{position:relative;width:100%;aspect-ratio:1;background:none}
  .eqdisc{position:absolute;inset:12%;border-radius:50%}
  .eqghost{box-shadow:inset 0 0 0 1px rgba(31,51,82,.35);transform-origin:50% 50%}
  .eqfillc{background:var(--cyan);opacity:.9;clip-path:inset(50% 0 50% 0);transition:clip-path .08s linear}
  .eqzero{position:absolute;left:12%;right:12%;top:50%;height:1px;background:rgba(140,140,140,.28)}
  .eqbar.reveal .eqghost{animation:discIn .55s ease-out}
  @keyframes discIn{0%{opacity:0}100%{opacity:1}}
  .eqcol em{font-style:normal;font-family:var(--hand);font-size:17px;color:var(--pencil)}
  .eqcol b{font-size:14px;font-weight:400;color:var(--pencil)}
  .eqcol b.set{color:var(--ink)}

  /* ---------- transport ---------- */
  .transport{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;margin:28px 0 0;align-items:center}
  .transport button{padding:14px 0;font-family:var(--hand);font-size:18px;color:var(--pencil)}
  #play{width:60px;height:60px;border-radius:50%;background:var(--cyan);color:#fff;line-height:0;
        justify-self:center}
  #play svg{width:19px;height:19px;display:block;margin:0 auto}
  #play[disabled]{background:rgba(140,140,140,.2)}

  /* ---------- note ---------- */
  .cuewrap{position:relative;margin:30px auto 0;width:auto;background:none;text-align:center}

    cx.fillStyle = lit ? bandColor(bi) : BODYDIM;
    cx.fillRect(x, h/2 - ar, bw, ar*2);
  }
}


function inBig(){ return document.body.classList.contains('big'); }
var ZOOMS = [12, 30, 4, 'whole'], zoomIdx = 0;
function curSpan(){ return viewSpan || dur || 1; }
function setWindow(span){
  viewSpan = (!span || span >= (dur || 0)) ? 0 : span;
  if (viewSpan) viewStart = pos() - viewSpan/2;
  var zb = document.getElementById('zoomBtn');
  if (zb) zb.textContent = viewSpan ? Math.round(viewSpan) + 's' : 'whole';
}
function bigMarks(w, h, prog){
  for (var k = 0; k < cues.length; k++){
    var nx = dur ? (cues[k].time - viewWin()[0])/viewWin()[1]*w : 0;
    if (nx < -6 || nx > w + 6) continue;
    cx.fillStyle = cues[k].resolved ? 'rgba(' + TH.dim + ',.4)' : TH.play;
    cx.beginPath(); cx.arc(nx, 9, 3.2, 0, 6.2832); cx.fill();
  }
  cx.save();
  cx.fillStyle = TH.play;
  cx.fillRect(prog*w - 1, 0, 2, h);
  cx.restore();
}
function drawBig(w, h){
  if (viewSpan) return drawZoomedMain(w, h);
  var L = rmsA ? rmsA.length : 0, prog = dur ? pos()/dur : 0;
  if (!L){ cx.fillStyle = BODYDIM; cx.fillRect(0, h/2 - 2, w, 4); return; }
  var N = Math.min(L, Math.floor(w/2.6)), step = w/N, bw = Math.max(1, step - 0.8);
  for (var i = 0; i < N; i++){
    var a = Math.floor(i*L/N), b = Math.max(a + 1, Math.floor((i+1)*L/N));
    var mr = 0, mp = 0, at = a;
    for (var j = a; j < b && j < L; j++){
      if (rmsA[j] > mr){ mr = rmsA[j]; at = j; }
      if (peaks[j] > mp) mp = peaks[j];
    }
    var ar = Math.max(0.8, mr*h*0.46), ap = Math.max(0.8, mp*h*0.46), x = i*step;
    var lit = (i/N) < prog;
    cx.fillStyle = lit ? PEAKTINT_LIT : PEAKTINT_DIM;
    cx.fillRect(x, h/2 - ap, bw, ap*2);
    cx.fillStyle = lit ? bandColor(at) : BODYDIM;
    cx.fillRect(x, h/2 - ar, bw, ar*2);
  }
  bigMarks(w, h, prog);
}

function drawWave(){
  var r = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight || 150;
  if (cv.width !== w*r || cv.height !== h*r){ cv.width = w*r; cv.height = h*r; }
  cx.setTransform(r,0,0,r,0,0); cx.clearRect(0,0,w,h);
  if (document.body.classList.contains('big')) return drawBig(w, h);
  var win = viewWin(), vst = win[0], vsp = win[1];
  var prog = dur ? (pos() - vst)/vsp : 0;
  if (viewSpan){
    drawZoomedMain(w, h);
  } else if (layers){
    cx.drawImage(layers.dim, 0, 0, w, h);
    cx.save(); cx.beginPath(); cx.rect(0, 0, prog*w, h); cx.clip();
    cx.drawImage(layers.lit, 0, 0, w, h); cx.restore();
  } else {
    cx.fillStyle = 'rgba(' + TH.dim + ',.2)'; cx.fillRect(0, h/2 - 1.5, w, 3);
  }
  for (var k = 0; k < cues.length; k++){
    var nx = dur ? cues[k].time/dur*w : 0;
    cx.fillStyle = cues[k].resolved ? 'rgba(' + TH.dim + ',.4)' : TH.play;
    cx.beginPath(); cx.arc(nx, 9, 3.2, 0, 6.2832); cx.fill();
  }
  cx.save();
  cx.fillStyle = TH.play;
  cx.fillRect(prog*w - 1, 0, 2, h);
  cx.restore();
}

function drawWave(){
  var r = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight || 150;
  if (cv.width !== w*r || cv.height !== h*r){ cv.width = w*r; cv.height = h*r; }
  cx.setTransform(r,0,0,r,0,0); cx.clearRect(0,0,w,h);
  if (document.body.classList.contains('big')) return drawBig(w, h);
  var win = viewWin(), vst = win[0], vsp = win[1];
  var prog = dur ? (pos() - vst)/vsp : 0;
  if (viewSpan){
    drawZoomedMain(w, h);
  } else if (layers){
    cx.drawImage(layers.dim, 0, 0, w, h);
    cx.save(); cx.beginPath(); cx.rect(0, 0, prog*w, h); cx.clip();
    cx.drawImage(layers.lit, 0, 0, w, h); cx.restore();
  } else {
    cx.fillStyle = 'rgba(' + TH.dim + ',.2)'; cx.fillRect(0, h/2 - 1.5, w, 3);
  }
  if (dur){
    var iv = dur > 480 ? 120 : (dur > 180 ? 60 : 30);
    cx.font = '700 10px "Helvetica Neue", Helvetica, sans-serif';
    for (var t = iv; t < dur; t += iv){
      var rx = t/dur*w;
      cx.fillStyle = 'rgba(46,107,42,.1)';
      cx.fillRect(rx, 0, 1, h);
      cx.fillStyle = 'rgba(46,107,42,.75)';
      var mm = Math.floor(t/60), ss = Math.floor(t%60);
      cx.fillText(mm + ':' + (ss < 10 ? '0' : '') + ss, rx + 4, 11);
    }
  }
  for (var k = 0; k < cues.length; k++){
    var nx = dur ? (cues[k].time - vst)/vsp*w : 0;
    if (nx < -6 || nx > w + 6) continue;
    var done = cues[k].resolved;
    // darker over the played cyan, navy over the unplayed grey
    var onPlayed = nx <= prog*w;
    var mc = onPlayed ? '18,44,16' : '46,107,42';
    cx.fillStyle = 'rgba(' + mc + ',' + (done ? .3 : .9) + ')';
    cx.fillRect(nx - 0.5, 0, 1, 7);
    cx.fillRect(nx - 0.5, h - 7, 1, 7);
  }
  var age = Date.now() - gainFlash;
  if (age < 1100){
    var al = Math.min(1, (1100 - age)/400);
    cx.save();
    cx.globalAlpha = al;
    cx.font = '200 34px "IBM Plex Mono", monospace';
    cx.textAlign = 'center';
    cx.fillStyle = Math.abs(db) < 0.05 ? TH.play : 'rgba(' + TH.lo + ',.95)';
    cx.fillText(Math.abs(db) < 0.05 ? 'original' : (db > 0 ? '+' : '') + db.toFixed(1), w/2, h/2 + 12);
    cx.restore();
  }
  cx.save();
  cx.fillStyle = TH.play; cx.fillRect(prog*w - 1, 0, 2, h); cx.restore();
  drawStrip();
}
var sc = $('strip'), sx = sc.getContext('2d');
function drawStrip(){
  var r = window.devicePixelRatio || 1, w = sc.clientWidth, h = 20;
  if (!w) return;
  if (sc.width !== w*r){ sc.width = w*r; sc.height = h*r; }
  sx.setTransform(r,0,0,r,0,0); sx.clearRect(0,0,w,h);
  if (!bands) return;
  var N = bands.lo.length, prog = dur ? pos()/dur : 0, bw = Math.max(1.2, w/N - 1);
  for (var i = 0; i < N; i++){
    var v = bands.lo[i], ht = Math.max(1.2, Math.pow(v, 0.65)*h);
    sx.fillStyle = (i/N) < prog
      ? 'rgba(' + TH.lo + ',' + (0.5 + 0.5*v).toFixed(2) + ')'
      : 'rgba(' + TH.dim + ',' + (0.22 + 0.3*v).toFixed(2) + ')';
    sx.fillRect(i/N*w, h - ht, bw, ht);
  }
}
var scrubbing = false, scrubWasPlaying = false, lastGrain = 0, lastScrubT = -1;

// short overlapping grains while dragging, so you hear the track move under your finger
function grain(t){
  if (!buffer) return;
  var g = ctx.createGain(), s2 = ctx.createBufferSource();
  s2.buffer = buffer;
  s2.connect(g); g.connect(gainNode); g.connect(dryOut);
  var now = ctx.currentTime, len = 0.14;
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(1, now + 0.012);
  g.gain.setValueAtTime(1, now + len - 0.035);
  g.gain.linearRampToValueAtTime(0, now + len);
  s2.start(now, Math.max(0, Math.min(t, dur - 0.16)));
  s2.stop(now + len);
  s2.onended = function(){ try { s2.disconnect(); g.disconnect(); } catch(e){} };
}

function xToT(el, e){
  var r = el.getBoundingClientRect(), f = (e.clientX - r.left)/r.width;
  if (el === cv && viewSpan){
    var win = viewWin();
    return Math.max(0, Math.min(win[0] + f*win[1], dur));
  }
  return Math.max(0, Math.min(f * dur, dur));
}

function attachScrub(el){
  var axis = null, x0 = 0, y0 = 0, active = false, tBase = 0;
  el.addEventListener('pointerdown', function(e){
    if (!buffer || pinching) return;
    e.preventDefault();
    if (ctx.state === 'suspended') ctx.resume();
    active = true; axis = null; x0 = e.clientX; y0 = e.clientY; tBase = pos();
    scrubWasPlaying = playing;
  });
  el.addEventListener('pointermove', function(e){
    if (!active) return;
    if (pinching){ active = false; scrubbing = false; return; }
    var dx = e.clientX - x0, dy = e.clientY - y0;
    if (!axis){
      if (Math.abs(dx) > 7){
        axis = 'scrub'; scrubbing = true;
        if (playing){ var p = pos(); stop(); offset = p; }
      } else return;
    }
    var t = (inBig() && el === cv)
      ? Math.max(0, Math.min(dur, tBase - dx/el.clientWidth*curSpan()))
      : xToT(el, e);
    offset = t;
    if (viewSpan) viewStart = t - viewSpan/2;
    $('pos').textContent = fmt(t); drawWave();
    if (Math.abs(t - lastScrubT) > 0.004 && ctx.currentTime - lastGrain > 0.05){
      lastGrain = ctx.currentTime; lastScrubT = t; grain(t);
    }
  });
  ['pointerup','pointercancel'].forEach(function(ev){
    el.addEventListener(ev, function(e){
      if (!active) return;
      active = false; scrubbing = false;
      var t = (inBig() && el === cv && axis === 'scrub')
        ? Math.max(0, Math.min(dur, tBase - (e.clientX - x0)/el.clientWidth*curSpan()))
        : xToT(el, e);
      msBuf = [];
      if (axis === 'scrub'){
        offset = t;
        if (scrubWasPlaying) start(t); else drawWave();
      } else {
        var n = Date.now();
        if (n - (el._tap || 0) < 330 && el === cv && !pinching){
          el._tap = 0;
          toggleBig();
        } else {
          el._tap = n;
          seek(t);
        }
      }
    });
  });
}
attachScrub(cv); attachScrub(sc);

(function(){
  var pts = {}, base = null;
  function dist(a, b){ return Math.abs(a - b); }
  function timeAt(clientX){
    var r = cv.getBoundingClientRect(), f = (clientX - r.left)/r.width;
    var win = viewWin();
    return win[0] + f*win[1];
  }
  document.addEventListener('pointerdown', function(e){
    if (!buffer) return;
    if (e.target.closest && e.target.closest('.sheet')) return;
    pts[e.pointerId] = e.clientX;
    var ids = Object.keys(pts);
    if (ids.length === 2){
      pinching = true;
      var x1 = pts[ids[0]], x2 = pts[ids[1]];
      base = { d: Math.max(12, dist(x1, x2)), span: viewSpan || dur,
               anchorT: timeAt((x1 + x2)/2), anchorF: ((x1 + x2)/2 - cv.getBoundingClientRect().left)/cv.clientWidth };
    }
  });
  document.addEventListener('pointermove', function(e){
    if (!(e.pointerId in pts)) return;
    pts[e.pointerId] = e.clientX;
    var ids = Object.keys(pts);
    if (ids.length !== 2 || !base) return;
    var d = Math.max(12, dist(pts[ids[0]], pts[ids[1]]));
    var span = Math.max(2, Math.min(base.span * (base.d/d), dur));
    viewSpan = span >= dur - 0.01 ? 0 : span;
    viewStart = base.anchorT - base.anchorF*(viewSpan || dur);
    var zb = $('zoomBtn');
    if (zb) zb.textContent = viewSpan ? Math.round(viewSpan) + 's' : 'whole';
    drawWave();
  });
  ['pointerup','pointercancel'].forEach(function(ev){
    document.addEventListener(ev, function(e){
      delete pts[e.pointerId];
      if (Object.keys(pts).length < 2){ base = null; setTimeout(function(){ pinching = false; }, 60); }
    });
  });
})();

// live zoom inside the sheet: 8 seconds around the playhead, scrolling
var zc = $('zoom'), zx = zc.getContext('2d');
function drawZoom(){
  if (!buffer) return;
  var r = window.devicePixelRatio || 1, w = zc.clientWidth, h = 56;
  if (!w) return;
  if (zc.width !== w*r){ zc.width = w*r; zc.height = h*r; }
  zx.setTransform(r,0,0,r,0,0); zx.clearRect(0,0,w,h);
  var span = 8, p = pos(), t0 = p - span/2, sr = buffer.sampleRate, ch = buffer.getChannelData(0);
  var N = 150, colDur = span/N, bw = Math.max(1.2, w/N - 1);
  for (var i = 0; i < N; i++){
    var ts = t0 + i*colDur, s0 = Math.floor(ts*sr), s1 = Math.floor((ts + colDur)*sr);
    if (s1 < 0 || s0 >= ch.length) continue;
    s0 = Math.max(0, s0); s1 = Math.min(ch.length, s1);
    var mx = 0;
    for (var j = s0; j < s1; j += 12){ var v = Math.abs(ch[j]); if (v > mx) mx = v; }
    var amp = Math.max(1, mx*h*0.42);
    zx.fillStyle = fieldColor(mx); zx.globalAlpha = .9;
    zx.fillRect(i/N*w, h/2 - amp, bw, amp*2);
  }
  zx.globalAlpha = 1;
  var mx2 = (stamped - t0)/span*w;
  if (mx2 > -4 && mx2 < w + 4){
    zx.save();
    zx.fillStyle = TH.core; zx.fillRect(mx2 - 1, 0, 2, h); zx.restore();
  }
  zx.fillStyle = '#2E6B2A'; zx.fillRect(w/2 - .5, 0, 1, h);
}

function tick(){
  try { frame(); } catch (err) { if (!window.__cbErr){ window.__cbErr = 1; console.error(err); } }
  requestAnimationFrame(tick);
}
function frame(){
  if (viewSpan && playing) viewStart = pos() - viewSpan/2;
  if (comp) $('led').classList.toggle('on', !bypassed && comp.reduction < -0.5);
  meter();
  if (buffer){ $('pos').textContent = fmt(pos()); drawWave(); }
  if (!$('sheet').classList.contains('hidden')){
    drawZoom();
    var d = pos() - stamped;
    $('sDrift').textContent = playing ? (d > 1 ? 'playing on, ' + d.toFixed(0) + 's past' : 'still playing') : 'paused';
  }
}
window.onresize = function(){ makeLayers(); drawWave(); };

$('cue').onclick = function(){
  stamped = pos();
  $('sTime').textContent = fmt(stamped);
  $('sText').value = '';
  sheetGlyphs = [];
  $('glyphbar').classList.remove('open');
  $('sheet').classList.remove('hidden');
  drawZoom();
  setTimeout(function(){ $('sText').focus(); }, 40);
};
// production shorthand. alts are structured now, surfaced on long press later.
var GLYPHS = [
  { g:'\u2191', alts:['\u2191','\u2191\u2191','\u2191\u2191\u2191'] },
  { g:'\u2193', alts:['\u2193','\u2193\u2193','\u2193\u2193\u2193'] },
  { g:'\u25E2' },
  { g:'\u25E3' },
  { g:'\uFF0B' },
  { g:'\u2212' },
  { g:'\u2702\uFE0E' },
  { g:'\u21BB' },
  { g:'\u2190' },
  { g:'\u2192' },
  { g:'\u2194' },
  { g:'\u2713' },
  { g:'!' }
];
var sheetGlyphs = [];

function insertGlyph(g){
  var ta = $('sText'), a = ta.selectionStart, b = ta.selectionEnd, v = ta.value;
  if (a == null){ a = v.length; b = v.length; }
  var ins = g + ' ';
  ta.value = v.slice(0, a) + ins + v.slice(b);
  try { ta.selectionStart = ta.selectionEnd = a + ins.length; } catch(e){}
  ta.focus();
  if (sheetGlyphs.indexOf(g) < 0) sheetGlyphs.push(g);
}

function buildGlyphs(){
  var bar = $('glyphbar');
  bar.innerHTML = '';
  GLYPHS.forEach(function(item){
    var b = document.createElement('button');
    b.textContent = item.g;
    var timer = null, fired = false;
    b.addEventListener('pointerdown', function(){
      fired = false;
      if (!item.alts) return;
      timer = setTimeout(function(){ fired = true; insertGlyph(item.alts[2]); }, 420);
    });
    ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
      b.addEventListener(ev, function(){ clearTimeout(timer); });
    });
    b.onclick = function(){ if (!fired) insertGlyph(item.g); };
    bar.appendChild(b);
  });
}
buildGlyphs();
$('glyphMore').onclick = function(){ $('glyphbar').classList.toggle('open'); };

['sheet','bpmSheet'].forEach(function(id){
  var el = $(id);
  if (!el) return;
  el.addEventListener('click', function(e){
    if (e.target === el) el.classList.add('hidden');
  });
});

$('sCancel').onclick = function(){ $('sheet').classList.add('hidden'); };
$('sSave').onclick = function(){
  var v = $('sText').value.trim();
  if (v) addCue(stamped, v, sheetGlyphs.slice());
  $('sheet').classList.add('hidden');
};
function addCue(time, text, glyphs){
  cues.push({ time: time, text: text, glyphs: glyphs || [], resolved: false });
  cues.sort(function(a,b){ return a.time - b.time; });
  render(); drawWave(); saveSoon();
}
function render(){
  var open = cues.filter(function(c){ return !c.resolved; }).length;
  $('ncount').textContent = cues.length
    ? open + ' OPEN \u00b7 ' + cues.length + ' NOTES'
    : 'NOTHING NOTED YET';
  $('nlist').innerHTML = '';
  cues.forEach(function(n){
    var d = document.createElement('div');
    d.className = 'n' + (n.resolved ? ' done' : '');
    var ring = document.createElement('button');
    ring.className = 'ring' + (n.resolved ? ' done' : '');
    ring.onclick = function(){ n.resolved = !n.resolved; render(); drawWave(); saveSoon(); };
    var t = document.createElement('time'); t.textContent = fmt(n.time);
    var p = document.createElement('p'); p.textContent = n.text;
    var go = function(){ seek(Math.max(0, n.time - 2)); };
    t.onclick = go; p.onclick = go;
    d.appendChild(ring); d.appendChild(t); d.appendChild(p);
    $('nlist').appendChild(d);
  });
}
$('copy').onclick = function(){
  var b = bpmBase ? bpmBase*([1,2,0.5][octIdx]||1) : 0;
  var head = $('title').textContent + (b ? '  \u00b7  ' + b.toFixed(1) + ' bpm' : '');
  var line = function(n){
    var bl = barLabel(n.time);
    return fmt(n.time) + (bl ? '  \u00b7  ' + bl : '') + '  \u00b7  ' + n.text;
  };
  var open = cues.filter(function(n){ return !n.resolved; }).map(line);
  var done = cues.filter(function(n){ return n.resolved; }).map(line);
  var txt = head + '\n' + open.join('\n');
  if (done.length) txt += '\n\ndone\n' + done.join('\n');
  navigator.clipboard.writeText(txt).then(function(){
    $('copy').textContent = 'copied \u00b7 paste into notes';
  }).catch(function(){ $('copy').textContent = 'copy blocked'; });
  setTimeout(function(){ $('copy').textContent = 'copy for notes'; }, 2200);
};

function reviewPayload(){
  var b = bpmBase ? +(bpmBase*([1,2,0.5][octIdx]||1)).toFixed(2) : null;
  return {
    format: 'car-bounce-review/1',
    track: $('title').textContent,
    durationSeconds: Math.round(dur*10)/10,
    bpm: b, timeSignature: '4/4',
    sharedAt: new Date().toISOString(),
    notes: cues.map(function(n){
      var x = beatsAt(n.time);
      return { time: Math.round(n.time*100)/100,
               beats: x ? Math.round(x.beats*1000)/1000 : null,
               bar: x ? x.bar : null,
               text: n.text, glyphs: n.glyphs || [], done: n.resolved };
    })
  };
}
function reviewText(){
  var b = bpmBase ? bpmBase*([1,2,0.5][octIdx]||1) : 0;
  var head = $('title').textContent + (b ? '  \u00b7  ' + b.toFixed(1) + ' bpm' : '');
  return head + '\n' + cues.map(function(n){
    var bl = barLabel(n.time);
    return fmt(n.time) + (bl ? '  \u00b7  ' + bl : '') + '  \u00b7  ' + n.text;
  }).join('\n');
}
function shareFallback(txt){
  navigator.clipboard.writeText(txt).then(function(){
    $('share').textContent = 'copied \u00b7 paste anywhere';
  }).catch(function(){
    $('share').textContent = 'sharing blocked here';
  });
  setTimeout(function(){ $('share').textContent = 'share'; }, 2200);
}
$('share').onclick = function(){
  var txt = reviewText(), name = $('title').textContent.replace(/\s+/g, '_');
  var ok = function(){
    $('share').textContent = 'shared';
    setTimeout(function(){ $('share').textContent = 'share'; }, 1600);
  };
  var failed = function(err){
    if (err && err.name === 'AbortError'){ $('share').textContent = 'share'; return; }
    shareFallback(txt);
  };
  if (!navigator.share) return shareFallback(txt);
  try {
    var file = new File([JSON.stringify(reviewPayload(), null, 2)], name + '_review.json',
                        { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      return navigator.share({ title: $('title').textContent, text: txt, files: [file] })
        .then(ok).catch(function(){
          navigator.share({ title: $('title').textContent, text: txt }).then(ok).catch(failed);
        });
    }
  } catch (e){}
  try {
    navigator.share({ title: $('title').textContent, text: txt }).then(ok).catch(failed);
  } catch (e){ shareFallback(txt); }
};

setGain(0);
buildThemes();
applyTheme('print', false);
store.get('cb:theme').then(function(t){ if (t) applyTheme(t, false); });
renderLibrary();
