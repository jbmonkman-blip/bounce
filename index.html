<title>Car Bounce &middot; Green</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Car Bounce">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png?v=3">
<link rel="icon" type="image/png" sizes="512x512" href="icon.png?v=3">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  :root{
    color-scheme:light only;
    --paper:#FFFFFF; --ink:#2B2B2B; --pencil:#8C8C8C; --teal:#5E8F4E; --cyan:#4CC64A;
    --hand:"Bradley Hand","Snell Roundhand","Marker Felt","Segoe Script",cursive;
    --sans:-apple-system,ui-sans-serif,"Helvetica Neue",Helvetica,sans-serif;
  }
  html{background:#FFFFFF}
  html,body{background:#FFFFFF !important}
  body::before{content:'cb-backplate';position:fixed;inset:-10vh -10vw;background:#FFFFFF;
               z-index:-1;color:transparent;font-size:0;pointer-events:none}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  *:focus,*:focus-visible{outline:none !important}
  textarea,input{-webkit-appearance:none;appearance:none;border:0}
  body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--sans);font-weight:400;
       font-size:16px;line-height:1.6;background:#FFFFFF;background-color:#FFFFFF;
       padding:calc(26px + env(safe-area-inset-top)) 24px calc(30px + env(safe-area-inset-bottom))}
  button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;font-weight:400}

  /* ---------- intro ---------- */
  .intro{position:relative;min-height:100vh;display:flex;flex-direction:column;
         align-items:center;justify-content:center;gap:30px;
         margin:calc(-26px - env(safe-area-inset-top)) -24px calc(-30px - env(safe-area-inset-bottom));
         padding:60px 24px 70px;background:#F4F2EC}
  .poster{display:flex;flex-direction:column;align-items:center;gap:0;width:100%;max-width:330px}
  .intro{gap:40px}
  .wordmark{position:absolute;left:0;right:0;bottom:26px;text-align:center;
            font-size:11px;font-weight:700;letter-spacing:.4em;color:var(--pencil);
            padding-left:.4em}
  .aperture{position:relative;width:100%;background:none;display:flex;flex-direction:column;
            align-items:center;gap:0;padding:0;animation:breathe 8s ease-in-out infinite}
  .bowl{width:min(52vw,196px);height:auto;display:block;color:var(--cyan)}
  .plate{display:block;background:var(--cyan);color:#F4F2EC;font-size:13px;font-weight:700;
         letter-spacing:.24em;padding:8px 20px}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @media (prefers-reduced-motion:reduce){.aperture{animation:none}}
  .intro p{margin:22px 0 0;color:var(--cyan);font-family:var(--hand);font-size:18px;
           font-weight:400;letter-spacing:.01em}
  .recent{width:100%;max-width:380px;display:flex;flex-direction:column;gap:2px}
  .recent h3{font-family:var(--hand);font-size:16px;color:var(--pencil);margin:8px 0 2px;font-weight:400}
  .recent button{display:flex;justify-content:space-between;align-items:baseline;gap:14px;width:100%;
    padding:11px 0;font-family:var(--hand);font-size:19px;color:var(--ink);text-align:left}
  .recent{max-width:330px}
  .recent button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .recent button em{font-style:normal;font-size:14px;color:var(--pencil);flex:none;font-family:var(--sans)}
  .themes{display:none}

  /* ---------- head ---------- */
  .head{display:flex;align-items:baseline;gap:14px;margin:0 0 2px}
  .title{flex:1 1 auto;min-width:0;font-family:var(--hand);font-size:26px;font-weight:400;
         color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .swap{font-size:14px;color:var(--pencil);flex:none;padding:10px 0}
  .status{font-size:14px;color:var(--pencil);margin:0 0 26px}
  .status.bad{color:#D2492F}
  .bpm{font:inherit;font-size:14px;color:var(--teal);padding:4px 0}

  /* ---------- waveform ---------- */
  canvas{display:block;width:100%;touch-action:none}
  .wavewrap{position:relative}
  #wave{height:110px;background:none}
  #strip{height:10px;margin-bottom:12px;background:none}
  #bigBtn{position:absolute;right:-4px;bottom:-4px;width:30px;height:30px;display:flex;
          align-items:center;justify-content:center;color:var(--pencil);opacity:.7;background:none}
  #bigBtn svg{width:13px;height:13px}
  #zoomBtn{position:absolute;left:-4px;bottom:-2px;display:none;font-family:var(--hand);
           font-size:16px;color:var(--pencil);padding:6px 4px}
  body.big #zoomBtn{display:block}
  body.big .status,body.big #strip,body.big .metarow,body.big .fader,
  body.big .details,body.big .list,body.big .hint,body.big #lib,body.big #swap{display:none}
  body.big #wave{height:calc(100vh - 280px);min-height:300px}
  .times{display:flex;justify-content:space-between;align-items:center;font-size:14px;
         color:var(--pencil);margin-top:14px}

  /* ---------- meta ---------- */
  .metarow{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:26px 0 0;
           font-size:14px;color:var(--pencil)}
  .metarow .meta{padding:8px 0;font:inherit;color:var(--pencil)}
  .metarow b{font-size:18px;font-weight:400;color:var(--ink)}
  .metarow b.hot{color:#D2492F}
  .gainlabel{display:flex;align-items:baseline;gap:7px}
  .gainlabel em{font-style:normal;font:inherit;color:#B3B0A8}
  #gainval{font-size:15px;color:var(--pencil)}
  .modewrap{display:flex;align-items:center;gap:9px}
  .modewrap button{font-family:var(--hand);font-size:18px;color:var(--cyan);padding:6px 2px}
  .modewrap button.off{color:var(--pencil)}
  .led{width:6px;height:6px;border-radius:50%;background:rgba(140,140,140,.3);flex:none}
  .led.on{background:#D2492F}
  .details{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin:14px 0 0;
           font-size:14px;color:var(--pencil)}
  .details b{font-size:16px;font-weight:400;color:var(--ink)}
  .details b.hot{color:#D2492F}

  /* ---------- gain ---------- */
  .fader,.fader *{touch-action:none}
  .fader{position:relative;height:40px;margin:6px 0 0}
  .fader .track{position:absolute;top:19px;left:0;right:0;height:1px;background:rgba(140,140,140,.28)}
  .fader .fill{position:absolute;top:19px;height:1px;background:var(--cyan)}
  .fader .unity{position:absolute;top:14px;width:1px;height:11px;background:rgba(140,140,140,.5)}
  .fader .thumb{position:absolute;top:13px;width:13px;height:13px;border-radius:50%;
                background:var(--cyan);margin-left:-6.5px}
  .scale{display:flex;justify-content:space-between;font-size:13px;color:var(--pencil)}

  /* ---------- eq ---------- */
  .eq{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin:18px 0 2px}
  .eqcol{display:flex;flex-direction:column;align-items:center;gap:8px}
  .eqbar,.eqbar *{touch-action:none}
  .eqbar{position:relative;width:100%;aspect-ratio:1;background:none}
  .eqdisc{position:absolute;inset:12%;border-radius:50%}
  .eqghost{box-shadow:inset 0 0 0 1px rgba(31,51,82,.35);transform-origin:50% 50%}
  .eqfillc{background:var(--cyan);opacity:.9;clip-path:inset(50% 0 50% 0);transition:clip-path .08s linear}
  .eqzero{position:absolute;left:12%;right:12%;top:50%;height:1px;background:rgba(140,140,140,.28)}
  .eqbar.reveal .eqghost{animation:discIn .55s ease-out}
  @keyframes discIn{0%{opacity:0}100%{opacity:1}}
  .eqcol em{font-style:normal;font-family:var(--hand);font-size:17px;color:var(--pencil)}
  .eqcol b{font-size:14px;font-weight:400;color:var(--pencil)}
  .eqcol b.set{color:var(--ink)}

  /* ---------- transport ---------- */
  .transport{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;margin:28px 0 0;align-items:center}
  .transport button{padding:14px 0;font-family:var(--hand);font-size:18px;color:var(--pencil)}
  #play{width:60px;height:60px;border-radius:50%;background:var(--cyan);color:#fff;line-height:0;
        justify-self:center}
  #play svg{width:19px;height:19px;display:block;margin:0 auto}
  #play[disabled]{background:rgba(140,140,140,.2)}

  /* ---------- note ---------- */
  .cuewrap{position:relative;margin:30px auto 0;width:auto;background:none;text-align:center}
  #cue{font-family:var(--hand);font-size:27px;color:var(--cyan);padding:10px 20px}
  .hint{text-align:center;font-size:14px;color:var(--pencil);margin:6px 0 26px}

  /* ---------- list ---------- */
  .list{padding-top:16px}
  .list h2{font-family:var(--hand);font-size:17px;font-weight:400;color:var(--pencil);margin:0 0 6px}
  .n{display:flex;gap:14px;padding:9px 0;align-items:flex-start}
  .ring{width:15px;height:15px;border-radius:50%;flex:none;margin-top:6px;padding:0;
        box-shadow:inset 0 0 0 1px rgba(140,140,140,.55);background:none}
  .ring.done{background:var(--cyan);box-shadow:none}
  .n time{font-size:14px;color:var(--pencil);flex:none;padding-top:5px;min-width:46px}
  .n p{margin:0;font-family:var(--hand);font-size:22px;line-height:1.35;flex:1;color:var(--ink)}
  .n.done p{color:var(--pencil);text-decoration:line-through}
  .export{display:flex;gap:18px;margin-top:22px;justify-content:flex-start}
  .export button{flex:0 0 auto;padding:8px 0;font-family:var(--hand);font-size:19px;color:var(--teal)}
  .export.sub{margin-top:6px}
  .export.sub button{color:var(--pencil);font-size:16px}

  /* ---------- sheets ---------- */
  .sheet{position:fixed;inset:0;background:rgba(43,43,43,.22);-webkit-backdrop-filter:blur(6px);
         backdrop-filter:blur(6px);display:flex;align-items:flex-end;padding:16px;z-index:9}
  .sheet .card{background:#fff;padding:24px 20px;width:100%;border-radius:6px;
               box-shadow:0 18px 50px rgba(30,40,55,.22)}
  .sheet .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .sheet time{font-size:16px;color:var(--pencil)}
  .sheet .top em{font-style:normal;font-size:14px;color:var(--pencil)}
  #zoom{height:44px;background:none}
  .sheet textarea{width:100%;margin:16px 0 6px;background:none;color:var(--ink);
    font-family:var(--hand);font-weight:400;font-size:24px;padding:0 0 10px;min-height:80px;
    line-height:1.4;caret-color:var(--cyan)}
  .sheet textarea::placeholder{color:var(--pencil);opacity:.55}
  .glyphwrap{display:flex;align-items:flex-start;gap:6px;margin:0 0 16px}
  .glyphs{display:flex;gap:4px;overflow-x:auto;flex:1;padding:4px 0;scrollbar-width:none}
  .glyphs::-webkit-scrollbar{display:none}
  .glyphs.open{flex-wrap:wrap;overflow:visible}
  .glyphs button{flex:none;min-width:40px;height:40px;color:var(--ink);opacity:.55;font-size:20px;line-height:1}
  .glyphs button:active{opacity:1;color:var(--cyan)}
  .glyphmore{flex:none;width:30px;height:40px;color:var(--pencil);font-size:17px}
  .bpmgrid{display:grid;gap:10px;margin:12px 0}
  .bpmgrid.four{grid-template-columns:repeat(4,1fr)}
  .bpmgrid.three{grid-template-columns:1fr 1.4fr 1fr}
  .bpmgrid button{padding:12px 0;font-family:var(--hand);font-size:19px;color:var(--teal)}
  .bpmgrid button.on{color:var(--cyan)}
  #bpmVal{font-family:var(--hand);font-size:35px;color:var(--ink)}
  .sheetnote{margin:12px 0 0;font-size:14px;color:var(--pencil)}
  .sheet .acts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
  .sheet .acts button{padding:12px 0;font-family:var(--hand);font-size:21px;color:var(--pencil)}
  .sheet .acts button:last-child{color:var(--cyan)}
  .sheet .acts.one{grid-template-columns:1fr}
  .sheet .acts.one button{color:var(--cyan)}
  .hidden{display:none}

  /* ---- one fixed screen: nothing scrolls but the list ---- */
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{display:flex;flex-direction:column;touch-action:manipulation}
  #app{flex:1;display:flex;flex-direction:column;min-height:0}
  .hidden,#app.hidden,.intro.hidden{display:none !important}
  .intro{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .list{flex:1;min-height:0;display:flex;flex-direction:column}
  #nlist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .export{flex:none}
  .eq,.details,.metarow,.fader,.transport,.cuewrap,.wavewrap,.times{flex:none}
  body.big #wave{height:calc(100dvh - 260px);min-height:200px}

  /* ---- give the notes list real room inside the fixed screen ---- */
  #wave{height:clamp(92px,16vh,150px)}
  .metarow{margin-top:14px}
  .details{margin-top:10px}
  .fader{margin-top:2px}
  .eq{margin:10px 0 0}
  .transport{margin-top:12px}
  .cuewrap{margin-top:14px}
  .list{padding-top:12px}
  .n{padding:9px 0}
  .export{margin-top:12px}
  body.big .list{min-height:0}

  /* ---- notes as a full screen list ---- */
  .listhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
  .listhead h2{margin:0}
  #listBig{flex:none;padding:6px 0 6px 10px;opacity:.6;display:flex;align-items:center;background:none}
  #listBig svg{width:15px;height:15px}
  #listBig:active{opacity:1}
  body.notesfull .wavewrap,body.notesfull .times,body.notesfull .metarow,body.notesfull .fader,
  body.notesfull .eq,body.notesfull .details,body.notesfull .transport,
  body.notesfull .cuewrap{display:none !important}
  body.notesfull .list{padding-top:8px}
  .list{min-height:0}

  /* ---- audit fixes ---- */
  body.notesfull #zoomBtn,body.notesfull #bigBtn{display:none !important}
  body.notesfull .status{display:block}

  @media (max-height:700px){
    #wave{height:clamp(76px,13vh,120px)}
    .metarow{margin-top:10px}
    .transport{margin-top:8px}
    .cuewrap{margin-top:10px}
    .transport button{padding:12px 0}
    #cue{padding:14px 0}
    .list{padding-top:8px}
  }

  /* ---- waveform gives way, notes keep three rows ---- */
  .wavewrap{flex:1 1 auto;display:flex;flex-direction:column;min-height:92px}
  #wave{flex:1 1 auto;height:auto;min-height:92px}
  .list{flex:0 0 auto;min-height:200px;display:flex;flex-direction:column}
  #nlist{flex:1 1 auto;min-height:118px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  body.big #wave{height:auto;flex:1 1 auto}
  body.notesfull .list{flex:1 1 auto;min-height:0}
  @media (max-height:700px){
    .list{min-height:176px}
    #nlist{min-height:100px}
  }

  /* ---- list is bounded; only the rows scroll ---- */
  .list{flex:1 1 auto;min-height:190px;max-height:100%}
  #nlist{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .export{flex:0 0 auto}
  .n{padding:8px 0}
  @media (max-height:700px){
    .list{min-height:168px}
    .n{padding:6px 0}
  }
  .n p{font-size:19px;line-height:1.3}
  .n time{font-size:13px;padding-top:4px;min-width:44px}
  .export button{padding:12px 0;font-size:17px}

  .export{margin-top:6px}
  .export button{padding:9px 0}
</style>
<style id="groundStyle"></style>

<input id="file" type="file" accept=".wav,.aif,.aiff,.m4a,.mp3,.flac,.aac,.ogg,.wave" class="hidden">

<div class="intro" id="intro">
  <div class="poster">
    <button class="aperture" id="loadBtn"><svg class="bowl" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <circle cx="100" cy="100" r="100" fill="currentColor" fill-opacity=".82"/>
  <text x="100" y="107" text-anchor="middle" fill="#F4F2EC"
        font-family="Bradley Hand, Snell Roundhand, Marker Felt, cursive"
        font-size="17" font-weight="400" letter-spacing=".4">load a bounce</text>
</svg></button>
    <p>wav &middot; aiff &middot; mp3 &middot; m4a &middot; flac</p>
  </div>
  <div class="recent" id="recent"></div>
</div>
</div>

<div id="app" class="hidden">
  <div class="head">
    <div class="title" id="title">&mdash;</div>
    <button class="swap" id="lib">library</button>
    <button class="swap" id="swap">change</button>
    <span class="themes" id="themes"></span>
  </div>
  <p class="status" id="status"></p>

  <canvas id="strip"></canvas>
  <div class="wavewrap">
    <canvas id="wave"></canvas>
    <button id="zoomBtn">12s</button>
    <button id="bigBtn" aria-label="full screen"><svg viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M15 20h5v-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div class="times"><span id="pos">0:00.0</span>
    <button id="bpm" class="bpm">set bpm</button>
    <span id="dur">0:00.0</span></div>

  <div class="metarow">
    <button class="meta" id="metaToggle"><b id="lufsS">&minus;&minus;.&minus;</b> lufs</button>
    <span class="gainlabel"><em>gain</em><b id="gainval">original</b></span>
    <span class="modewrap"><span class="led" id="led"></span>
      <button id="eqBtn" class="off">eq</button></span>
  </div>
  <div class="fader" id="fader">
    <div class="track"></div><div class="fill" id="fill"></div>
    <div class="unity" id="unity"></div><div class="thumb" id="thumb"></div>
  </div>
  <div class="eq hidden" id="eq"></div>
  <div class="details hidden" id="details">
    <span><b id="lufsM">&minus;&minus;.&minus;</b> mom</span>
    <span><b id="peak">&minus;&minus;.&minus;</b> peak</span>
    <span><b id="corr">&mdash;</b> corr</span>
    <span>double tap any slider to zero it</span>
  </div>

  <div class="transport">
    <button id="back">&#9666; 8 bars</button>
    <button id="play" disabled><svg viewBox="0 0 24 24" aria-label="play"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg></button>
    <button id="fwd">8 bars &#9656;</button>
  </div>

  <div class="cuewrap"><button id="cue">new note</button></div>

  <div class="list">
    <div class="listhead"><h2 id="ncount">NOTHING NOTED YET</h2><button id="listBig" aria-label="all notes"><svg viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M15 20h5v-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
    <div id="nlist"></div>
    <div class="export">
      <button id="share">share</button>
      <button id="copy">copy for notes</button>
    </div>
  </div>
</div>

<div class="sheet hidden" id="bpmSheet"><div class="card">
  <div class="top"><time id="bpmVal">&mdash;</time><em>beats per minute</em></div>
  <div class="bpmgrid four">
    <button class="nudge" data-d="-1">&minus;1</button>
    <button class="nudge" data-d="-0.1">&minus;0.1</button>
    <button class="nudge" data-d="0.1">+0.1</button>
    <button class="nudge" data-d="1">+1</button>
  </div>
  <div class="bpmgrid three">
    <button id="bHalf">&divide;2</button>
    <button id="bTap">tap tempo</button>
    <button id="bDouble">&times;2</button>
  </div>
  <div class="acts one"><button id="bSave">done</button></div>
</div></div>

<div class="sheet hidden" id="sheet"><div class="card">
  <div class="top"><time id="sTime">0:00.0</time><em id="sDrift">still playing</em></div>
  <canvas id="zoom"></canvas>
  <textarea id="sText" placeholder="what's the move?"></textarea>
  <div class="glyphwrap">
    <div class="glyphs" id="glyphbar"></div>
    <button class="glyphmore" id="glyphMore">&#8943;</button>
  </div>
  <div class="acts"><button id="sCancel">drop it</button><button id="sSave">save note</button></div>
</div></div>

<script>
var $ = function(id){ return document.getElementById(id); };
var PLAY_ICON = '<svg viewBox="0 0 24 24" aria-label="play"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>';
var PAUSE_ICON = '<svg viewBox="0 0 24 24" aria-label="pause"><rect x="8" y="5.5" width="3.2" height="13" rx="1.1" fill="currentColor"/><rect x="13.6" y="5.5" width="3.2" height="13" rx="1.1" fill="currentColor"/></svg>';
var THEMES = {
  print: { core:'#4CC64A', violet:'#8AD483', cyan:'#B7DEA8', bone:'#5E5E5E', muted:'#5E8F4E',
    haze:'rgba(46,107,42,.08)', bg:'#F1ECE2', ground:'transparent',
    lo:[76,198,74], md:[128,212,120], hi:[176,222,168],
    dim:'26,58,24', play:'#2E6B2A' }
};
var themeName = 'print', TH = THEMES.print;
function applyTheme(n, save){
  if (!THEMES[n]) n = 'print';
  themeName = n; TH = THEMES[n];
  var r = document.documentElement.style;


  Array.prototype.forEach.call(document.querySelectorAll('.themes button'), function(b){
    b.classList.toggle('on', b.getAttribute('data-t') === n);
  });

  zx.globalAlpha = 1;

  if (mx2 > -4 && mx2 < w + 4){
    zx.save();
    zx.fillStyle = TH.core; zx.fillRect(mx2 - 1, 0, 2, h); zx.restore();
  }
  zx.fillStyle = '#2E6B2A'; zx.fillRect(w/2 - .5, 0, 1, h);
}

function tick(){
  try { frame(); } catch (err) { if (!window.__cbErr){ window.__cbErr = 1; console.error(err); } }
  requestAnimationFrame(tick);
}
function frame(){
  if (viewSpan && playing) viewStart = pos() - viewSpan/2;
  if (comp) $('led').classList.toggle('on', !bypassed && comp.reduction < -0.5);
  meter();
  if (buffer){ $('pos').textContent = fmt(pos()); drawWave(); }
  if (!$('sheet').classList.contains('hidden')){
    drawZoom();
    var d = pos() - stamped;
    $('sDrift').textContent = playing ? (d > 1 ? 'playing on, ' + d.toFixed(0) + 's past' : 'still playing') : 'paused';
  }
}
window.onresize = function(){ makeLayers(); drawWave(); };

$('cue').onclick = function(){
  stamped = pos();
  $('sTime').textContent = fmt(stamped);
  $('sText').value = '';
  sheetGlyphs = [];
  $('glyphbar').classList.remove('open');
  $('sheet').classList.remove('hidden');
  drawZoom();
  setTimeout(function(){ $('sText').focus(); }, 40);
};
// production shorthand. alts are structured now, surfaced on long press later.
var GLYPHS = [
  { g:'\u2191', alts:['\u2191','\u2191\u2191','\u2191\u2191\u2191'] },
  { g:'\u2193', alts:['\u2193','\u2193\u2193','\u2193\u2193\u2193'] },
  { g:'\u25E2' },
  { g:'\u25E3' },
  { g:'\uFF0B' },
  { g:'\u2212' },
  { g:'\u2702\uFE0E' },
  { g:'\u21BB' },
  { g:'\u2190' },
  { g:'\u2192' },
  { g:'\u2194' },
  { g:'\u2713' },
  { g:'!' }
];
var sheetGlyphs = [];

function insertGlyph(g){
  var ta = $('sText'), a = ta.selectionStart, b = ta.selectionEnd, v = ta.value;
  if (a == null){ a = v.length; b = v.length; }
  var ins = g + ' ';
  ta.value = v.slice(0, a) + ins + v.slice(b);
  try { ta.selectionStart = ta.selectionEnd = a + ins.length; } catch(e){}
  ta.focus();
  if (sheetGlyphs.indexOf(g) < 0) sheetGlyphs.push(g);
}

function buildGlyphs(){
  var bar = $('glyphbar');
  bar.innerHTML = '';
  GLYPHS.forEach(function(item){
    var b = document.createElement('button');
    b.textContent = item.g;
    var timer = null, fired = false;
    b.addEventListener('pointerdown', function(){
      fired = false;
      if (!item.alts) return;
      timer = setTimeout(function(){ fired = true; insertGlyph(item.alts[2]); }, 420);
    });
    ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
      b.addEventListener(ev, function(){ clearTimeout(timer); });
    });
    b.onclick = function(){ if (!fired) insertGlyph(item.g); };
    bar.appendChild(b);
  });
}
buildGlyphs();
$('glyphMore').onclick = function(){ $('glyphbar').classList.toggle('open'); };

['sheet','bpmSheet'].forEach(function(id){
  var el = $(id);
  if (!el) return;
  el.addEventListener('click', function(e){
    if (e.target === el) el.classList.add('hidden');
  });
});

$('sCancel').onclick = function(){ $('sheet').classList.add('hidden'); };
$('sSave').onclick = function(){
  var v = $('sText').value.trim();
  if (v) addCue(stamped, v, sheetGlyphs.slice());
  $('sheet').classList.add('hidden');
};
function addCue(time, text, glyphs){
  cues.push({ time: time, text: text, glyphs: glyphs || [], resolved: false });
  cues.sort(function(a,b){ return a.time - b.time; });
  render(); drawWave(); saveSoon();
}
function render(){
  var open = cues.filter(function(c){ return !c.resolved; }).length;
  $('ncount').textContent = cues.length
    ? open + ' OPEN \u00b7 ' + cues.length + ' NOTES'
    : 'NOTHING NOTED YET';
  $('nlist').innerHTML = '';
  cues.forEach(function(n){
    var d = document.createElement('div');
    d.className = 'n' + (n.resolved ? ' done' : '');
    var ring = document.createElement('button');
    ring.className = 'ring' + (n.resolved ? ' done' : '');
    ring.onclick = function(){ n.resolved = !n.resolved; render(); drawWave(); saveSoon(); };
    var t = document.createElement('time'); t.textContent = fmt(n.time);
    var p = document.createElement('p'); p.textContent = n.text;
    var go = function(){ seek(Math.max(0, n.time - 2)); };
    t.onclick = go; p.onclick = go;
    d.appendChild(ring); d.appendChild(t); d.appendChild(p);
    $('nlist').appendChild(d);
  });
}
$('copy').onclick = function(){
  var b = bpmBase ? bpmBase*([1,2,0.5][octIdx]||1) : 0;
  var head = $('title').textContent + (b ? '  \u00b7  ' + b.toFixed(1) + ' bpm' : '');
  var line = function(n){
    var bl = barLabel(n.time);
    return fmt(n.time) + (bl ? '  \u00b7  ' + bl : '') + '  \u00b7  ' + n.text;
  };
  var open = cues.filter(function(n){ return !n.resolved; }).map(line);
  var done = cues.filter(function(n){ return n.resolved; }).map(line);
  var txt = head + '\n' + open.join('\n');
  if (done.length) txt += '\n\ndone\n' + done.join('\n');
  navigator.clipboard.writeText(txt).then(function(){
    $('copy').textContent = 'copied \u00b7 paste into notes';
  }).catch(function(){ $('copy').textContent = 'copy blocked'; });
  setTimeout(function(){ $('copy').textContent = 'copy for notes'; }, 2200);
};

function reviewPayload(){
  var b = bpmBase ? +(bpmBase*([1,2,0.5][octIdx]||1)).toFixed(2) : null;
  return {
    format: 'car-bounce-review/1',
    track: $('title').textContent,
    durationSeconds: Math.round(dur*10)/10,
    bpm: b, timeSignature: '4/4',
    sharedAt: new Date().toISOString(),
    notes: cues.map(function(n){
      var x = beatsAt(n.time);
      return { time: Math.round(n.time*100)/100,
               beats: x ? Math.round(x.beats*1000)/1000 : null,
               bar: x ? x.bar : null,
               text: n.text, glyphs: n.glyphs || [], done: n.resolved };
    })
  };
}
function reviewText(){
  var b = bpmBase ? bpmBase*([1,2,0.5][octIdx]||1) : 0;
  var head = $('title').textContent + (b ? '  \u00b7  ' + b.toFixed(1) + ' bpm' : '');
  return head + '\n' + cues.map(function(n){
    var bl = barLabel(n.time);
    return fmt(n.time) + (bl ? '  \u00b7  ' + bl : '') + '  \u00b7  ' + n.text;
  }).join('\n');
}
function shareFallback(txt){
  navigator.clipboard.writeText(txt).then(function(){
    $('share').textContent = 'copied \u00b7 paste anywhere';
  }).catch(function(){
    $('share').textContent = 'sharing blocked here';
  });
  setTimeout(function(){ $('share').textContent = 'share'; }, 2200);
}
$('share').onclick = function(){
  var txt = reviewText(), name = $('title').textContent.replace(/\s+/g, '_');
  var ok = function(){
    $('share').textContent = 'shared';
    setTimeout(function(){ $('share').textContent = 'share'; }, 1600);
  };
  var failed = function(err){
    if (err && err.name === 'AbortError'){ $('share').textContent = 'share'; return; }
    shareFallback(txt);
  };
  if (!navigator.share) return shareFallback(txt);
  try {
    var file = new File([JSON.stringify(reviewPayload(), null, 2)], name + '_review.json',
                        { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      return navigator.share({ title: $('title').textContent, text: txt, files: [file] })
        .then(ok).catch(function(){
          navigator.share({ title: $('title').textContent, text: txt }).then(ok).catch(failed);
        });
    }
  } catch (e){}
  try {
    navigator.share({ title: $('title').textContent, text: txt }).then(ok).catch(failed);
  } catch (e){ shareFallback(txt); }
};

setGain(0);
buildThemes();
applyTheme('print', false);
store.get('cb:theme').then(function(t){ if (t) applyTheme(t, false); });
renderLibrary();
</script>
